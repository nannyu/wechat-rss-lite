[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-rss-lite"
version = "0.1.0"
description = "Lightweight Apache-2.0 toolkit for parsing WeChat articles and producing RSS feeds."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "wechat-rss-lite contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "segno>=1.6,<2",
  "socksio>=1,<2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110,<1",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.27,<1",
]
tls = [
  "curl-cffi>=0.7,<1",
]
dev = [
  "fastapi>=0.110,<1",
  "python-multipart>=0.0.9,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "respx>=0.21,<1",
]

[project.scripts]
wechat-rss-lite = "wechat_rss_lite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_rss_lite"]

[tool.hatch.build.targets.wheel.force-include]
"src/wechat_rss_lite/admin/assets" = "wechat_rss_lite/admin/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
